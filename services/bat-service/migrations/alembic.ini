# Alembic config for bat-service (M07).
# sqlalchemy.url is overridden programmatically via CIP_DATABASE_URL.

[alembic]
script_location = .
prepend_sys_path = .
version_path_separator = os
timezone = UTC
sqlalchemy.url = postgresql+asyncpg://cip:cip@localhost:5432/cip

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
