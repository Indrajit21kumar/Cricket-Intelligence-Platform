[project]
name = "ball-service"
version = "0.1.0"
description = "M08 Ball Tracking - ball events, line/length and ESTIMATED speed."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "cip-annotation",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ball_service"]
