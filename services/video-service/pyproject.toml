[project]
name = "video-service"
version = "0.1.0"
description = "CIP Video Intelligence service (M05) — ingest, preprocess, calibrate, quality-gate clips."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

# Opt-in extra for the real (non-fake) preprocessing path. Kept out of the
# base dependencies so CI never installs a CV stack it does not need — the
# default binding is still FakeVideoProcessor/FakeStorageProvider.
[project.optional-dependencies]
real = ["opencv-python-headless>=4.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_service"]
