[project]
name = "physics-service"
version = "0.1.0"
description = "M11 Physics Engine - converts M10 biomechanics into the physics of the shot (measured kinematics + estimated dynamics)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/physics_service"]
