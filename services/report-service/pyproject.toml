[project]
name = "report-service"
version = "0.1.0"
description = "M14 Report Generator / AI Coach - narrates M13's grounded findings into a coaching report and a RAG-grounded AI Coach."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/report_service"]
