[project]
name = "billing-service"
version = "0.1.0"
description = "CIP Subscription & Billing service (M03)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # M03 additions
    "redis[hiredis]>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/billing_service"]
