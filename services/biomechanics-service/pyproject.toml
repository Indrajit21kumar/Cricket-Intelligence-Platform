[project]
name = "biomechanics-service"
version = "0.1.0"
description = "M10 Biomechanics Engine - computes the 17 CIP-STD metrics per stroke."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/biomechanics_service"]
