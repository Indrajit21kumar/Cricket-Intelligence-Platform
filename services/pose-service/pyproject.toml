[project]
name = "pose-service"
version = "0.1.0"
description = "CIP Pose Engine service (M06) — per-frame body keypoints from normalised clips."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pose_service"]
