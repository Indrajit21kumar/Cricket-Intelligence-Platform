[project]
name = "reasoning-service"
version = "0.1.0"
description = "M13 Reasoning Engine - executes M12 rules over M10/M11/M09 facts into explained, evidence-linked findings."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reasoning_service"]
