[project]
name = "identity-service"
version = "0.1.0"
description = "CIP Identity & Authentication service (M02)."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    # M02 additions
    "pyjwt>=2.10",
    "argon2-cffi>=23.1",
    "email-validator>=2.2",
    "slowapi>=0.1.9",
    "authlib>=1.3",
    "redis[hiredis]>=5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/identity_service"]
