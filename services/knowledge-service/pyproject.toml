[project]
name = "knowledge-service"
version = "0.1.0"
description = "M12 Cricket Knowledge Graph - governed, versioned store of coaching rules (Fault->Cause->Risk->Drill) served to M13/M14."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "cip-core",
    "cip-observability",
    "cip-data",
    "cip-events",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knowledge_service"]
