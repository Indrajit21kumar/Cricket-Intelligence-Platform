# Alembic config for the shared platform schema.
# sqlalchemy.url is set programmatically (from CIP_DATABASE_URL) by
# cip_data.migrations and by env.py; the value here is a placeholder only.

[alembic]
script_location = .
prepend_sys_path = .
version_path_separator = os
timezone = UTC
sqlalchemy.url = postgresql+asyncpg://cip:cip@localhost:5432/cip

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
