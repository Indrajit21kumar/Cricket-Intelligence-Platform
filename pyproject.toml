[project]
name = "cip"
version = "0.1.0"
description = "Cricket Intelligence Platform — monorepo root"
requires-python = ">=3.12,<3.13"
readme = "README.md"
license = { file = "LICENSE" }

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
cip-core = { workspace = true }
cip-observability = { workspace = true }
cip-data = { workspace = true }
cip-events = { workspace = true }

[dependency-groups]
dev = [
    "ruff>=0.13",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.28",
    "bandit[toml]>=1.7",
    "pip-audit>=2.7",
    "pre-commit>=4.0",
    "schemathesis>=3.36",
]

# ---------------------------------------------------------------------------
# Ruff — linter + formatter (Book 3, Ch. 2 §2.2)
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/base/versions", ".venv", "docs/specs"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # bugbear
    "C4",  # comprehensions
    "SIM", # simplify
    "RUF", # ruff-specific
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"**/__init__.py" = ["F401"]
# HTTP exception classes read naturally without the Error suffix
# (raise NotFound("player X") mirrors FastAPI / Django conventions).
"libs/cip-core/src/cip_core/errors.py" = ["N818"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------------------------------------------------------------------------
# mypy — strict static typing (Book 3, Ch. 2 §2.2)
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
warn_redundant_casts = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
namespace_packages = true
explicit_package_bases = true
files = [
    "libs/cip-core/src",
    "libs/cip-observability/src",
    "libs/cip-data/src",
    "libs/cip-events/src",
    "services/reference-service/src",
]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# FastAPI's route decorators are typed as returning Any-ish callables, which trips
# mypy strict's untyped-decorator rule. Allow it for the module that mounts routes;
# the handler bodies are still strictly typed.
[[tool.mypy.overrides]]
module = ["reference_service.main"]
disallow_untyped_decorators = false

# aiokafka does not ship type stubs (or a py.typed marker) at the moment.
# Treat its symbols as Any rather than blocking the build; the wrapper in
# cip_events.kafka is thin enough that this doesn't hide real bugs.
[[tool.mypy.overrides]]
module = ["aiokafka", "aiokafka.*"]
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# pytest (Book 3, Ch. 6 §6.1)
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
asyncio_mode = "auto"
testpaths = ["libs", "services", "scripts/tests"]
# importlib mode lets multiple packages have identically-named test files
# (e.g. tests/test_smoke.py in each lib) without collection collisions.
addopts = "-ra --strict-markers --strict-config --import-mode=importlib"
markers = [
    "integration: tests requiring live infra (Postgres, Kafka, Redis)",
    "contract: consumer/provider contract tests (Schemathesis)",
]
filterwarnings = [
    # Upstream: FastAPI 0.139 still imports starlette.testclient which now warns.
    "ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning",
]

[tool.coverage.run]
source = ["libs", "services"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0  # raised as libraries mature; Book 3 requires threshold on changed code

# ---------------------------------------------------------------------------
# Bandit — SAST (Book 3, Ch. 5)
# ---------------------------------------------------------------------------
[tool.bandit]
exclude_dirs = ["tests", ".venv", "docs"]
