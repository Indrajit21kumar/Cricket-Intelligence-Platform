# CIP CI — implements the Book 3 Ch. 7 gate sequence.
# All jobs must be green to merge (branch protection enforced on GitHub).
#
# Sequence (per Book 3 §7): lint → type-check → unit → integration → contract → security → build.
# The jobs run in parallel where safe; the merge queue enforces the ordering.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.11.30"
  PYTHON_VERSION: "3.12"

jobs:
  # ------------------------------------------------------------- 1. lint
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - name: Install workspace
        run: uv sync --frozen --all-packages
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .

  # ------------------------------------------------------------- 2. type-check
  typecheck:
    name: type-check (mypy strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --all-packages
      - name: mypy
        run: uv run mypy

  # ------------------------------------------------------------- 3. unit
  unit:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --all-packages
      - name: pytest (unit only)
        run: uv run pytest -m "not integration and not contract" --cov --cov-report=xml
      # Release gates (ENG-007, AC-M06-06 / AC-M07-06): a vision model whose
      # accuracy regresses beyond tolerance against its golden dataset must not
      # ship. Run as their own step so a failure names the cause instead of
      # hiding in the suite — red here blocks the merge that bumps the model.
      - name: Model validation gates (ENG-007)
        run: |
          uv run pytest services/pose-service/tests/test_validation.py -q
          uv run pytest services/bat-service/tests/test_validation.py -q
          uv run pytest services/ball-service/tests/test_validation.py -q
          uv run pytest services/shot-service/tests/test_validation.py -q
          uv run pytest services/biomechanics-service/tests/test_validation.py -q
          uv run pytest services/physics-service/tests/test_validation.py -q
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage.xml
          if-no-files-found: ignore

  # ------------------------------------------------------------- 4. integration
  # Requires live infra (Postgres, Redpanda, Redis) — wired in Step 4/5.
  # In Step 1 there are no integration tests yet; the job runs and passes vacuously.
  integration:
    name: integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
          POSTGRES_DB: cip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --all-packages
      # Redpanda needs command-line args; the GH `services:` shortcut can't
      # pass them, so start it as a docker container in this step.
      - name: Start Redpanda (Kafka-wire event bus)
        run: |
          docker run -d --name redpanda -p 9092:9092 \
            redpandadata/redpanda:v24.2.4 \
            redpanda start \
              --smp=1 --memory=1G --overprovisioned --node-id=0 --check=false \
              --kafka-addr=PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr=PLAINTEXT://localhost:9092
          for i in {1..60}; do
            if docker exec redpanda rpk cluster health >/dev/null 2>&1; then
              echo "redpanda healthy after ${i}s"; break
            fi
            sleep 1
          done
      - name: pytest (integration only)
        env:
          CIP_DATABASE_URL: postgresql+asyncpg://cip:cip@localhost:5432/cip
          CIP_REDIS_URL: redis://localhost:6379/0
          CIP_KAFKA_BOOTSTRAP: localhost:9092
        # Exit code 5 = no tests collected; treat as success (early modules
        # may not have integration tests yet).
        run: |
          set +e
          uv run pytest -m integration
          code=$?
          if [ $code -eq 0 ] || [ $code -eq 5 ]; then exit 0; else exit $code; fi
      - name: Redpanda logs on failure
        if: failure()
        run: docker logs redpanda | tail -100

  # ------------------------------------------------------------- 5. contract
  # Schemathesis property-tests every endpoint against FastAPI's OpenAPI schema.
  # The reference-service lifespan opens DB + Kafka + Redis on startup, so
  # this job needs the same infra as the integration job.
  contract:
    name: contract tests (schemathesis)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cip
          POSTGRES_PASSWORD: cip
          POSTGRES_DB: cip
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U cip"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --all-packages
      - name: Start Redpanda
        run: |
          docker run -d --name redpanda -p 9092:9092 \
            redpandadata/redpanda:v24.2.4 \
            redpanda start \
              --smp=1 --memory=1G --overprovisioned --node-id=0 --check=false \
              --kafka-addr=PLAINTEXT://0.0.0.0:9092 \
              --advertise-kafka-addr=PLAINTEXT://localhost:9092
          for i in {1..60}; do
            if docker exec redpanda rpk cluster health >/dev/null 2>&1; then break; fi
            sleep 1
          done
      - name: Apply base migrations
        env:
          CIP_DATABASE_URL: postgresql+asyncpg://cip:cip@localhost:5432/cip
        run: uv run python -c "from cip_data.migrations import upgrade_head; upgrade_head('postgresql+asyncpg://cip:cip@localhost:5432/cip')"
      - name: Start reference-service
        env:
          CIP_DATABASE_URL: postgresql+asyncpg://cip:cip@localhost:5432/cip
          CIP_REDIS_URL: redis://localhost:6379/0
          CIP_KAFKA_BOOTSTRAP: localhost:9092
        run: |
          uv run uvicorn reference_service.main:app --host 127.0.0.1 --port 8000 &
          echo $! > /tmp/uvicorn.pid
          for i in {1..30}; do
            if curl -sf http://127.0.0.1:8000/health/live > /dev/null; then break; fi
            sleep 1
          done
      - name: Schemathesis run
        # Exclude the /v1/demo/* routes: they exist to exercise the full
        # stack for integration tests, not as a public API contract, and
        # their tenant-header requirement isn't expressible in OpenAPI
        # today. Real endpoints in later modules will be contract-tested.
        run: uv run schemathesis run --checks all --exclude-tag demo http://127.0.0.1:8000/openapi.json

  # ------------------------------------------------------------- 6. security
  security:
    name: security scan (bandit + pip-audit + gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen --all-packages
      - name: Bandit (SAST)
        run: uv run bandit -r libs services -c pyproject.toml
      - name: Export third-party deps for audit
        run: uv export --no-emit-workspace --no-editable --no-hashes --format requirements-txt --quiet > requirements-audit.txt
      - name: pip-audit (dependency scan)
        run: uv run pip-audit --strict -r requirements-audit.txt
      - name: gitleaks (secrets scan)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ------------------------------------------------------------- 7. build
  # Verifies the reference-service image builds cleanly. Runtime verification
  # happens in the contract + integration jobs (which supply the infra the
  # service's lifespan connects to on startup). Running the container here
  # without infra would just fail on lifespan startup, testing nothing.
  build:
    name: build reference-service image
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - name: docker build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/reference-service/Dockerfile
          push: false
          load: true
          tags: cip/reference-service:ci
      - name: Confirm image is loadable
        run: docker image inspect cip/reference-service:ci > /dev/null
