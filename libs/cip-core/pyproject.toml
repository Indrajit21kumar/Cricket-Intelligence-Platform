[project]
name = "cip-core"
version = "0.1.0"
description = "CIP shared foundation: config, tenancy, correlation, error envelope."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = [
    "pydantic>=2.13",
    "pydantic-settings>=2.6",
    "fastapi>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip_core"]
