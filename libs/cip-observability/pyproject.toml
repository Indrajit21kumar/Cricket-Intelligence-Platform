[project]
name = "cip-observability"
version = "0.1.0"
description = "CIP observability baseline: structlog + OpenTelemetry logs/metrics/traces."
requires-python = ">=3.12,<3.13"
readme = "README.md"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cip_observability"]
